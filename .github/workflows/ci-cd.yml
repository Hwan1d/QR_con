name: QR Canvas CI/CD & GitOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/kustomization.yaml'
      - '**.md'
      - '.gemini/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Node.js 환경 세팅 & 캐싱
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install Dependencies
        run: npm ci

      # 4. 3종 통합 테스트 실행 (단 하나라도 실패 시 빌드 즉시 차단)
      - name: Run Test Suites
        run: npm test

      # 5. Docker Buildx 세팅
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Docker 이미지 빌드 및 Docker Hub 푸시
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/qr-canvas-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/qr-canvas-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Kustomize로 k8s 매니페스트 이미지 태그 자동 갱신 (GitOps)
      - name: Update K8s Manifest (Kustomize)
        run: |
          cd k8s
          # kustomize edit을 통해 새 commit sha 태그로 갱신
          sed -i 's|newTag:.*|newTag: '${{ github.sha }}'|g' kustomization.yaml
          cat kustomization.yaml

      # 9. 갱신된 k8s 매니페스트를 main 브랜치로 자동 커밋 & 푸시
      - name: Commit & Push GitOps Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore(gitops): update image tag to ${{ github.sha }} [skip ci]"
            git push origin main
          fi
