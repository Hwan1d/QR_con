<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Portal</title>
  <!-- PeerJS for Serverless WebRTC P2P communication (Works on GitHub Pages & LTE/5G!) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- QRCode Generator in Browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fafafa;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ================= STATE 1: LONELY QR VIEW ================= */
    #qr-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      z-index: 20;
      transition: opacity 0.7s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #qr-stage.unlocked {
      opacity: 0;
      transform: scale(2.4) rotate(8deg);
      pointer-events: none;
    }

    .qr-box {
      position: relative;
      padding: 24px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 308px;
      min-height: 308px;
    }

    .qr-box:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.12);
    }

    #qr-container img, #qr-container canvas {
      display: block !important;
      width: 260px !important;
      height: 260px !important;
      border-radius: 8px;
    }

    /* Subtle breathing pulse ring around the lonely QR */
    .qr-box::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 34px;
      border: 1.5px solid rgba(0, 0, 0, 0.06);
      animation: breathe 3s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.04); opacity: 0; }
    }

    .loading-text {
      font-size: 13px;
      color: #999;
      position: absolute;
    }

    .sim-hint {
      position: fixed;
      bottom: 18px;
      font-size: 12px;
      color: #c0c0c0;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #qr-stage:hover .sim-hint {
      opacity: 1;
    }

    /* ================= STATE 2: TRANSFORMED STAGE ================= */
    #arcade-stage {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #15192b 0%, #070810 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      overflow: hidden;
    }

    #arcade-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    #stage-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Overlay on Big Screen */
    .hud-top {
      position: absolute;
      top: 24px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #00f5d4;
      box-shadow: 0 0 12px #00f5d4;
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .mode-indicator {
      padding: 8px 18px;
      background: linear-gradient(135deg, rgba(123, 44, 191, 0.4), rgba(0, 245, 212, 0.25));
      border: 1px solid rgba(0, 245, 212, 0.4);
      border-radius: 999px;
      color: #00f5d4;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      box-shadow: 0 0 24px rgba(0, 245, 212, 0.2);
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }

    .score-pill {
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: #fee440;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    .mini-qr-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .mini-qr-card:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Big Center Announcement Banner on Transformation */
    #unlock-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      z-index: 15;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #unlock-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #unlock-banner h1 {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #00f5d4, #fee440, #f15bb5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 10px 30px rgba(0, 245, 212, 0.4));
    }

    #unlock-banner p {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 20px;
      font-weight: 500;
    }

    .hud-bottom {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      background: rgba(10, 12, 22, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- 1. INITIAL LONELY QR PAGE -->
  <div id="qr-stage">
    <div class="qr-box" id="qr-box" title="스마트폰으로 스캔하거나 클릭하여 테스트 컨트롤러 열기">
      <span class="loading-text" id="qr-loading">QR 생성 중...</span>
      <div id="qr-container"></div>
    </div>
    <div class="sim-hint">스마트폰 카메라로 스캔하세요 (PC에서 바로 테스트하려면 QR 클릭)</div>
  </div>

  <!-- 2. TRANSFORMED INTERACTIVE ARCADE & CANVAS STAGE -->
  <div id="arcade-stage">
    <div class="hud-top">
      <div class="badge-group">
        <div class="live-badge">
          <span class="live-dot"></span>
          <span id="player-status">CONTROLLER CONNECTED</span>
        </div>
        <div class="mode-indicator" id="mode-badge">MODE: NEON CANVAS</div>
      </div>

      <div class="hud-right">
        <div class="score-pill" id="score-display">SCORE: 0</div>
        <div class="mini-qr-card" id="reset-btn" title="클릭하면 처음 QR 페이지로 돌아갑니다">
          <div>
            <div style="font-weight:700; color:#fff;">🔄 첫 QR 화면으로</div>
            <div style="font-size:11px; opacity:0.7;">클릭 시 초기화</div>
          </div>
        </div>
      </div>
    </div>

    <div id="unlock-banner">
      <h1 id="banner-title">PORTAL UNLOCKED!</h1>
      <p id="banner-sub">스마트폰으로 화면을 조종해보세요</p>
    </div>

    <canvas id="stage-canvas"></canvas>

    <div class="hud-bottom" id="hud-tip">
      📱 스마트폰에서 조이스틱을 움직이거나 물감 폭탄·불꽃놀이·메시지를 발사하세요!
    </div>
  </div>

  <script>
    const qrStage = document.getElementById('qr-stage');
    const arcadeStage = document.getElementById('arcade-stage');
    const qrContainer = document.getElementById('qr-container');
    const qrLoading = document.getElementById('qr-loading');
    const qrBox = document.getElementById('qr-box');
    const resetBtn = document.getElementById('reset-btn');
    const unlockBanner = document.getElementById('unlock-banner');
    const bannerTitle = document.getElementById('banner-title');
    const bannerSub = document.getElementById('banner-sub');
    const modeBadge = document.getElementById('mode-badge');
    const scoreDisplay = document.getElementById('score-display');
    const playerStatus = document.getElementById('player-status');

    let controllerUrl = '';
    let isUnlocked = false;
    let currentMode = 'canvas'; // 'canvas' | 'arcade' | 'fireworks'
    let score = 0;

    // Web Audio Synth for sound effects
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'unlock') {
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0.15, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.35);
          });
        } else if (type === 'splat') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180 + Math.random() * 250, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.18);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'firework') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.25);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'hit') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(440 + Math.random() * 220, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }
      } catch (e) {}
    }

    // ================= PEERJS (WEBRTC) SETUP =================
    // Works across ANY network (Wi-Fi, LTE, 5G) and on GitHub Pages without a custom backend!
    const roomId = 'qrcon-' + Math.random().toString(36).substring(2, 9);
    const peer = new Peer(roomId, {
      debug: 1
    });

    peer.on('open', (id) => {
      qrLoading.style.display = 'none';
      const basePath = window.location.origin + window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
      controllerUrl = `${basePath}/controller.html?peer=${encodeURIComponent(id)}`;

      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: controllerUrl,
        width: 260,
        height: 260,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    });

    peer.on('connection', (conn) => {
      conn.on('data', (msg) => {
        if (!msg || !msg.event) return;

        if (msg.event === 'join-controller') {
          if (!isUnlocked) {
            unlockStage(msg.nickname || 'PLAYER 1');
          } else {
            showBanner(`${msg.nickname || 'NEW PLAYER'} JOINED!`, '새로운 컨트롤러가 연결되었습니다');
            spawnFirework(canvas.width / 2, canvas.height / 2, msg.color || '#00f5d4', 70);
          }
          playerStatus.textContent = `${msg.nickname || 'PLAYER 1'} LIVE`;
        } else if (msg.event === 'switch-mode') {
          switchMode(msg.mode);
        } else if (msg.event === 'reset-to-qr') {
          resetToLonelyQr();
        } else if (msg.event === 'controller-action') {
          handleControllerAction(msg);
        }
      });
    });

    // Optional Socket.io fallback when running local node server.js
    if (typeof io !== 'undefined') {
      try {
        const socket = io();
        socket.emit('join-screen', roomId);
        socket.on('qr-triggered', (data) => {
          if (!isUnlocked) unlockStage(data.nickname || 'PLAYER 1');
        });
        socket.on('mode-switched', (data) => switchMode(data.mode));
        socket.on('reset-screen', () => resetToLonelyQr());
        socket.on('screen-action', (payload) => handleControllerAction(payload));
      } catch (e) {}
    }

    // Clicking the QR on PC opens a simulated phone controller popup for instant testing
    qrBox.addEventListener('click', () => {
      initAudio();
      if (controllerUrl) {
        window.open(
          controllerUrl,
          'PhoneController',
          'width=410,height=780,left=100,top=80'
        );
      }
    });

    resetBtn.addEventListener('click', () => {
      resetToLonelyQr();
    });

    function showBanner(title, sub) {
      bannerTitle.textContent = title;
      bannerSub.textContent = sub;
      unlockBanner.classList.add('show');
      setTimeout(() => {
        unlockBanner.classList.remove('show');
      }, 2400);
    }

    function unlockStage(nickname) {
      isUnlocked = true;
      qrStage.classList.add('unlocked');
      arcadeStage.classList.add('active');
      playSound('unlock');
      showBanner('PORTAL UNLOCKED!', `${nickname}님의 스마트폰이 컨트롤러로 연결되었습니다`);

      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          spawnFirework(
            canvas.width * (0.25 + Math.random() * 0.5),
            canvas.height * (0.25 + Math.random() * 0.4),
            ['#00f5d4', '#fee440', '#f15bb5', '#9b5de5', '#00bbf9'][i % 5],
            65
          );
        }, i * 180);
      }
    }

    function resetToLonelyQr() {
      isUnlocked = false;
      qrStage.classList.remove('unlocked');
      arcadeStage.classList.remove('active');
      splats.length = 0;
      particles.length = 0;
      floatingTexts.length = 0;
    }

    // ================= CANVAS & ARCADE ENGINE =================
    const canvas = document.getElementById('stage-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initBricks();
    }
    window.addEventListener('resize', resize);

    const cursor = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: 0,
      vy: 0,
      color: '#00f5d4',
      radius: 18,
      trail: []
    };

    const particles = [];
    const splats = [];
    const floatingTexts = [];

    const paddle = { width: 170, height: 18, x: 400 };
    const ball = { x: 500, y: 400, vx: 6, vy: -6, radius: 11 };
    let bricks = [];

    function initBricks() {
      bricks = [];
      const rows = 5;
      const cols = 9;
      const pad = 12;
      const offsetTop = 110;
      const offsetLeft = 80;
      const totalW = canvas.width - offsetLeft * 2;
      const brickW = (totalW - pad * (cols - 1)) / cols;
      const brickH = 28;
      const palette = ['#f15bb5', '#fee440', '#00f5d4', '#00bbf9', '#9b5de5'];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: offsetLeft + c * (brickW + pad),
            y: offsetTop + r * (brickH + pad),
            w: brickW,
            h: brickH,
            color: palette[r % palette.length],
            alive: true
          });
        }
      }
      paddle.x = canvas.width / 2 - paddle.width / 2;
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 120;
      ball.vx = 6 * (Math.random() > 0.5 ? 1 : -1);
      ball.vy = -6.5;
    }

    resize();

    function switchMode(mode) {
      currentMode = mode;
      if (mode === 'canvas') {
        modeBadge.textContent = 'MODE: NEON GRAFFITI CANVAS';
        showBanner('NEON GRAFFITI', '조이스틱으로 그림을 그리고 물감 폭탄을 던지세요!');
      } else if (mode === 'arcade') {
        modeBadge.textContent = 'MODE: BRICK BREAKER ARCADE';
        initBricks();
        showBanner('ARCADE START!', '폰 조이스틱을 좌우로 움직여 공을 튕기세요!');
      } else if (mode === 'fireworks') {
        modeBadge.textContent = 'MODE: SKY FIREWORKS SHOW';
        showBanner('FIREWORKS SHOW', '폰에서 대형 불꽃을 쏘아올리세요!');
      }
      playSound('unlock');
    }

    function spawnFirework(x, y, color, count = 55) {
      playSound('firework');
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
        const speed = 2 + Math.random() * 9;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          alpha: 1,
          size: 3 + Math.random() * 4,
          gravity: 0.08
        });
      }
    }

    function spawnPaintSplat(x, y, color) {
      playSound('splat');
      const blobs = [];
      const mainRadius = 28 + Math.random() * 34;
      for (let i = 0; i < 14; i++) {
        const ang = Math.random() * Math.PI * 2;
        const dist = mainRadius * (0.6 + Math.random() * 0.9);
        blobs.push({
          dx: Math.cos(ang) * dist,
          dy: Math.sin(ang) * dist,
          r: 4 + Math.random() * 14
        });
      }
      splats.push({ x, y, r: mainRadius, color, blobs, createdAt: Date.now() });
      if (splats.length > 60) splats.shift();

      score += 10;
      scoreDisplay.textContent = `SCORE: ${score}`;
    }

    function handleControllerAction(payload) {
      if (!isUnlocked) {
        unlockStage(payload.nickname || 'PLAYER 1');
      }

      if (payload.color) {
        cursor.color = payload.color;
      }

      switch (payload.type) {
        case 'joystick': {
          cursor.vx = payload.dx * 12;
          cursor.vy = payload.dy * 12;
          break;
        }
        case 'splat': {
          const tx = payload.randomPos
            ? canvas.width * (0.15 + Math.random() * 0.7)
            : cursor.x;
          const ty = payload.randomPos
            ? canvas.height * (0.2 + Math.random() * 0.6)
            : cursor.y;
          spawnPaintSplat(tx, ty, cursor.color);
          spawnFirework(tx, ty, cursor.color, 25);
          break;
        }
        case 'firework': {
          const fx = canvas.width * (0.15 + Math.random() * 0.7);
          const fy = canvas.height * (0.15 + Math.random() * 0.5);
          spawnFirework(fx, fy, payload.color || cursor.color, 70);
          score += 25;
          scoreDisplay.textContent = `SCORE: ${score}`;
          break;
        }
        case 'emoji': {
          floatingTexts.push({
            text: payload.emoji || '🚀',
            x: cursor.x + (Math.random() - 0.5) * 80,
            y: cursor.y,
            vy: -3.5 - Math.random() * 2,
            alpha: 1,
            size: 54
          });
          playSound('hit');
          break;
        }
        case 'message': {
          floatingTexts.push({
            text: payload.text,
            x: canvas.width / 2 + (Math.random() - 0.5) * 240,
            y: canvas.height * 0.75,
            vy: -2.2,
            alpha: 1,
            size: 42,
            color: cursor.color
          });
          spawnFirework(canvas.width / 2, canvas.height * 0.4, cursor.color, 50);
          break;
        }
        case 'clear': {
          splats.length = 0;
          cursor.trail.length = 0;
          showBanner('CANVAS CLEARED', '캔버스가 깨끗하게 초기화되었습니다');
          break;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!isUnlocked) return;

      ctx.fillStyle = currentMode === 'fireworks' ? 'rgba(7, 8, 16, 0.22)' : 'rgba(10, 12, 24, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      cursor.x = Math.max(24, Math.min(canvas.width - 24, cursor.x + cursor.vx));
      cursor.y = Math.max(24, Math.min(canvas.height - 24, cursor.y + cursor.vy));

      if (Math.hypot(cursor.vx, cursor.vy) > 0.5) {
        cursor.trail.push({ x: cursor.x, y: cursor.y, color: cursor.color, life: 1 });
        if (cursor.trail.length > 80) cursor.trail.shift();

        if (currentMode === 'fireworks' && Math.random() < 0.25) {
          particles.push({
            x: cursor.x,
            y: cursor.y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            color: cursor.color,
            alpha: 1,
            size: 3,
            gravity: 0.04
          });
        }
      }

      if (currentMode === 'canvas') {
        for (const s of splats) {
          ctx.save();
          ctx.fillStyle = s.color;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();

          for (const b of s.blobs) {
            ctx.beginPath();
            ctx.arc(s.x + b.dx, s.y + b.dy, b.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      if (currentMode === 'arcade') {
        paddle.x = Math.max(20, Math.min(canvas.width - paddle.width - 20, paddle.x + cursor.vx * 1.4));

        ctx.save();
        ctx.fillStyle = cursor.color;
        ctx.shadowColor = cursor.color;
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.roundRect(paddle.x, canvas.height - 75, paddle.width, paddle.height, 9);
        ctx.fill();
        ctx.restore();

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
          ball.vx *= -1;
          playSound('hit');
        }
        if (ball.y - ball.radius < 0) {
          ball.vy *= -1;
          playSound('hit');
        }

        if (
          ball.vy > 0 &&
          ball.y + ball.radius >= canvas.height - 75 &&
          ball.y - ball.radius <= canvas.height - 75 + paddle.height &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.width
        ) {
          const hitOffset = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          ball.vx = hitOffset * 8.5;
          ball.vy = -Math.abs(ball.vy);
          playSound('hit');
          spawnFirework(ball.x, ball.y, cursor.color, 18);
        }

        if (ball.y > canvas.height + 30) {
          ball.x = paddle.x + paddle.width / 2;
          ball.y = canvas.height - 110;
          ball.vy = -6.5;
        }

        let aliveCount = 0;
        for (const b of bricks) {
          if (!b.alive) continue;
          aliveCount++;

          if (
            ball.x + ball.radius > b.x &&
            ball.x - ball.radius < b.x + b.w &&
            ball.y + ball.radius > b.y &&
            ball.y - ball.radius < b.y + b.h
          ) {
            b.alive = false;
            ball.vy *= -1;
            score += 50;
            scoreDisplay.textContent = `SCORE: ${score}`;
            spawnFirework(b.x + b.w / 2, b.y + b.h / 2, b.color, 28);
          }

          ctx.save();
          ctx.fillStyle = b.color;
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 6);
          ctx.fill();
          ctx.restore();
        }

        if (aliveCount === 0) {
          initBricks();
          showBanner('STAGE CLEAR! 🎉', '보너스 +500점 획득!');
          score += 500;
          scoreDisplay.textContent = `SCORE: ${score}`;
        }

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f5d4';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (let i = 0; i < cursor.trail.length; i++) {
        const t = cursor.trail[i];
        t.life -= 0.016;
        if (t.life <= 0) continue;
        ctx.save();
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.life * 0.7;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 10 * t.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (currentMode !== 'arcade') {
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.fillStyle = cursor.color;
        ctx.shadowColor = cursor.color;
        ctx.shadowBlur = 24;
        ctx.beginPath();
        ctx.arc(cursor.x, cursor.y, cursor.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.alpha -= 0.016;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.008;
        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.font = `800 ${ft.size}px Pretendard, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = ft.color || '#ffffff';
        ctx.shadowColor = ft.color || '#00f5d4';
        ctx.shadowBlur = 16;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }
    }

    animate();
  </script>
</body>
</html>
