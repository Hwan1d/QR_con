<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Graffiti Rooms & Art Platform</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="supabase-adapter.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ====================================================
       1. 첫 화면: 로그인 & 룸 로비 (Lobby View)
       ==================================================== */
    #lobby-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, #161b2e 0%, #080a10 100%);
      display: flex;
      flex-direction: column;
      z-index: 500;
      overflow-y: auto;
      padding: 30px 40px;
    }

    .lobby-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(135deg, #00f5d4, #00bbf9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lobby-user-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-create-room {
      background: linear-gradient(135deg, #00f5d4, #00bbf9);
      color: #05070d;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 245, 212, 0.3);
      transition: transform 0.2s;
    }
    .btn-create-room:hover { transform: scale(1.03); }

    /* 룸 카드 그리드 */
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .room-card {
      background: rgba(25, 30, 48, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 160px;
      backdrop-filter: blur(8px);
    }
    .room-card:hover {
      transform: translateY(-4px);
      border-color: #00f5d4;
      box-shadow: 0 10px 30px rgba(0, 245, 212, 0.2);
    }
    .room-card.secret {
      border-color: rgba(192, 132, 252, 0.4);
    }
    .room-card.secret:hover {
      border-color: #c084fc;
      box-shadow: 0 10px 30px rgba(192, 132, 252, 0.25);
    }

    /* ====================================================
       2. 인게임 화면: 대형 캔버스 & 카메라 팔로우
       ==================================================== */
    #game-screen {
      display: none;
      position: absolute;
      inset: 0;
    }

    #world-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* 상단 헤더 HUD */
    .game-hud-top {
      position: fixed;
      top: 18px;
      left: 20px;
      background: rgba(15, 18, 30, 0.85);
      border: 1px solid rgba(0, 245, 212, 0.3);
      border-radius: 16px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .btn-hud {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-hud:hover {
      background: #00f5d4;
      color: #000;
      border-color: #00f5d4;
    }

    /* 우측 상단 미니맵 */
    .minimap-card {
      position: fixed;
      top: 18px;
      right: 20px;
      width: 180px;
      height: 135px;
      background: rgba(15, 18, 30, 0.85);
      border: 1px solid rgba(0, 245, 212, 0.4);
      border-radius: 14px;
      z-index: 100;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .minimap-card canvas { width: 100%; height: 100%; display: block; }

    /* 상단 AI 도슨트 오버레이 */
    #ai-docent-banner {
      display: none;
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 10, 35, 0.95);
      border: 2px solid #c084fc;
      box-shadow: 0 0 35px rgba(192, 132, 252, 0.5);
      border-radius: 18px;
      padding: 14px 28px;
      max-width: 820px;
      width: 88%;
      color: #fff;
      z-index: 1000;
      animation: fadeInDown 0.4s ease;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* 하단 감사 로그 스타일 */
    .audit-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(10, 12, 20, 0.85);
      border: 1px solid #00f5d4;
      color: #00f5d4;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #audit-modal {
      display: none;
      position: fixed;
      bottom: 74px;
      left: 20px;
      width: 480px;
      max-height: 380px;
      background: rgba(12, 14, 24, 0.95);
      border: 1px solid rgba(0, 245, 212, 0.4);
      border-radius: 16px;
      padding: 16px;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      overflow-y: auto;
    }

    /* 모달 팝업 공통 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .modal-box {
      background: #141726;
      border: 1.5px solid #00f5d4;
      border-radius: 24px;
      padding: 28px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- ====================================================
       화면 1: 첫 화면 (로그인 / 회원가입 + 룸 로비)
       ==================================================== -->
  <div id="lobby-screen">
    <div class="lobby-header">
      <div class="brand-title">
        <span>🎨 Infinite Graffiti IO</span>
      </div>
      <div class="lobby-user-bar">
        <div id="lobby-auth-status" style="font-size: 13px;">
          <!-- 로그인 상태 렌더링 -->
        </div>
        <button class="btn-create-room" onclick="openCreateRoomModal()">+ 새 캔버스 방 열기</button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="font-size: 18px; color: #fff;">🖼️ 개설된 캔버스 벽 목록</h2>
      <button class="btn-hud" onclick="loadRoomsList()">🔄 목록 새로고침</button>
    </div>

    <!-- 룸 카드 목록 -->
    <div class="rooms-grid" id="rooms-container">
      <!-- 룸 카드들 동적 주입 -->
    </div>
  </div>

  <!-- ====================================================
       화면 2: 인게임 대형 캔버스 화면
       ==================================================== -->
  <div id="game-screen">
    <div class="game-hud-top">
      <button class="btn-hud" onclick="leaveToLobby()">⬅ 로비로 나가기</button>
      <div style="font-size: 14px; font-weight: 800; color: #00f5d4; display: flex; align-items: center; gap: 6px;">
        <span id="ingame-room-badge" style="background:#9333ea; color:#fff; padding:2px 8px; border-radius:6px; font-size:11px;">LOBBY</span>
        <span id="ingame-room-title">열린 광장 캔버스</span>
      </div>
      <button class="btn-hud" onclick="openQrModal()">📷 방 QR 코드</button>
      <button class="btn-hud" style="color: #00f5d4; border-color: #00f5d4;" onclick="toggleVirtualController()">📱 가상 컨트롤러 (웹 테스트)</button>
    </div>

    <!-- 캔버스 본체 -->
    <canvas id="world-canvas"></canvas>

    <!-- 우측 상단 미니맵 -->
    <div class="minimap-card">
      <canvas id="minimap-canvas"></canvas>
    </div>

    <!-- 상단 AI 아트 도슨트 비평 배너 -->
    <div id="ai-docent-banner">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span style="font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px; background: #9333ea; color: #fff;">
          ✨ AI ART CURATOR
        </span>
        <span id="ai-meta-tag" style="font-size: 11px; color: #d8b4fe;">Gemini 실시간 분석</span>
      </div>
      <div id="ai-comment-text" style="font-size: 16px; font-weight: 800; color: #faf5ff; text-shadow: 0 0 10px #c084fc; line-height: 1.4;">
        도슨트 비평 로딩 중...
      </div>
    </div>
  </div>

  <!-- 방 전용 QR 팝업 모달 -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal-box" style="text-align: center;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color:#00f5d4; font-size:16px;">📱 스마트폰 연동 QR</h3>
        <button onclick="closeQrModal()" style="background:none; border:none; color:#888; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <p style="font-size:12px; opacity:0.75; margin-top:4px;">
        스마트폰으로 스캔하면 <strong id="modal-room-code-label" style="color:#00f5d4;">LOBBY</strong> 방에 즉시 연동됩니다!
      </p>
      <div id="modal-qr-container" style="display:flex; justify-content:center; margin:16px 0;"></div>
      <div style="font-size:11px; color:#aaa; word-break:break-all;" id="modal-qr-url"></div>
      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button onclick="openControllerNewTab()" style="flex:1; padding:10px; border-radius:10px; border:1px solid #00f5d4; background:transparent; color:#00f5d4; font-weight:800; cursor:pointer;">
          새 탭으로 열기 ↗
        </button>
        <button onclick="closeQrModal()" style="flex:1; padding:10px; border-radius:10px; border:none; background:#00f5d4; color:#000; font-weight:800; cursor:pointer;">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- PC 웹 테스트용 가상 스마트폰 컨트롤러 창 -->
  <div id="virtual-phone-container" style="display: none; position: fixed; right: 24px; bottom: 24px; width: 380px; height: 680px; background: #000; border: 3px solid #00f5d4; border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); z-index: 1500; overflow: hidden; flex-direction: column;">
    <div style="background: #121420; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <span style="font-size: 12px; font-weight: 800; color: #fff;">📱 웹 가상 컨트롤러</span>
      <div style="display: flex; gap: 6px;">
        <button onclick="openControllerNewTab()" style="background: none; border: none; color: #00f5d4; font-size: 13px; cursor: pointer;">↗ 새탭</button>
        <button onclick="toggleVirtualController()" style="background: none; border: none; color: #888; font-size: 16px; cursor: pointer;">✕</button>
      </div>
    </div>
    <iframe id="virtual-phone-frame" src="" style="width: 100%; height: 100%; border: none;"></iframe>
  </div>

  <!-- 새 방 만들기 모달 -->
  <div class="modal-overlay" id="create-room-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="color:#00f5d4; font-size:16px;">🎨 새 캔버스 방 만들기</h3>
        <button onclick="closeCreateRoomModal()" style="background:none; border:none; color:#888; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <div class="form-group">
        <label>방 코드 (영문/숫자, 고유 ID)</label>
        <input type="text" id="new-room-code" placeholder="예: NEON-777, MY-STUDIO">
      </div>
      <div class="form-group">
        <label>방 제목 (화면에 표시될 이름)</label>
        <input type="text" id="new-room-title" placeholder="예: 밤하늘 네온 아트 갤러리">
      </div>
      <div class="form-group" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="new-room-is-secret" style="width:auto;" onchange="toggleSecretInput(this.checked)">
        <label for="new-room-is-secret" style="margin:0; color:#c084fc; cursor:pointer;">🔒 비밀방으로 설정 (코드로만 입장)</label>
      </div>
      <div class="form-group" id="secret-code-group" style="display:none;">
        <label>비밀 입장 코드 (숫자/비밀번호)</label>
        <input type="password" id="new-room-secret-code" placeholder="비밀 코드를 입력하세요">
      </div>
      <button class="btn-create-room" style="width:100%; margin-top:8px;" onclick="submitCreateRoom()">캔버스 생성 및 입장</button>
    </div>
  </div>

  <!-- 비밀방 입장 코드 확인 모달 -->
  <div class="modal-overlay" id="secret-entry-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="color:#c084fc; font-size:16px;">🔒 비밀방 입장</h3>
        <button onclick="closeSecretEntryModal()" style="background:none; border:none; color:#888; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <p style="font-size:12px; opacity:0.8; margin-bottom:12px;">
        <strong id="secret-target-room-name" style="color:#00f5d4;"></strong> 방은 비밀 코드가 필요합니다.
      </p>
      <div class="form-group">
        <label>비밀 입장 코드</label>
        <input type="password" id="entry-secret-code" placeholder="비밀 코드를 입력하세요">
      </div>
      <button class="btn-create-room" style="width:100%;" onclick="submitSecretEntry()">입장하기</button>
    </div>
  </div>

  <!-- 로비 전용 로그인 & 회원가입 탭 모달 -->
  <div class="modal-overlay" id="lobby-login-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="color:#00f5d4; font-size:16px; margin:0;">🎨 아티스트 로그인 / 회원가입</h3>
      </div>

      <!-- 탭 바 -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:14px; background:rgba(0,0,0,0.4); padding:4px; border-radius:10px;">
        <button id="lobby-tab-btn-login" onclick="switchLobbyAuthTab('login')" style="padding:8px; border:none; border-radius:8px; background:#00f5d4; color:#000; font-size:12px; font-weight:800; cursor:pointer;">
          🔑 로그인
        </button>
        <button id="lobby-tab-btn-reg" onclick="switchLobbyAuthTab('register')" style="padding:8px; border:none; border-radius:8px; background:transparent; color:#888; font-size:12px; font-weight:800; cursor:pointer;">
          ✨ 회원가입
        </button>
      </div>

      <!-- 1. 로그인 폼 -->
      <form id="lobby-form-login" onsubmit="handleLobbyLogin(event)" style="display:block;">
        <div class="form-group">
          <label>아티스트 아이디</label>
          <input type="text" id="lobby-login-id" placeholder="아이디 (예: user_a)" required />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="lobby-login-pw" placeholder="비밀번호" required />
        </div>
        <button type="submit" class="btn-create-room" style="width:100%; margin-top:6px;">로그인하기</button>

        <div style="margin-top:14px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08);">
          <div style="font-size:11px; opacity:0.6; margin-bottom:6px; text-align:center;">빠른 테스트 계정:</div>
          <div style="display:flex; gap:6px;">
            <button type="button" onclick="quickLobbyAuth('user_a')" style="flex:1; padding:7px; border-radius:8px; border:1px solid #00f5d4; background:rgba(0,245,212,0.12); color:#00f5d4; font-size:11px; font-weight:700; cursor:pointer;">
              👑 user_a (VIP)
            </button>
            <button type="button" onclick="quickLobbyAuth('user_b')" style="flex:1; padding:7px; border-radius:8px; border:1px solid #f15bb5; background:rgba(241,91,181,0.12); color:#f15bb5; font-size:11px; font-weight:700; cursor:pointer;">
              🎨 user_b (일반)
            </button>
          </div>
        </div>
      </form>

      <!-- 2. 회원가입 폼 -->
      <form id="lobby-form-reg" onsubmit="handleLobbyRegister(event)" style="display:none;">
        <div class="form-group">
          <label>새 아티스트 아이디</label>
          <input type="text" id="lobby-reg-id" placeholder="영문/숫자 아이디" required />
        </div>
        <div class="form-group">
          <label>닉네임 / 활동명</label>
          <input type="text" id="lobby-reg-alias" placeholder="화면에 표시될 이름" required />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="lobby-reg-pw" placeholder="비밀번호" required />
        </div>
        <div class="form-group">
          <label>아티스트 등급 선택</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px;">
            <label style="display:flex; align-items:center; gap:6px; padding:6px; border-radius:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); font-size:11px; cursor:pointer;">
              <input type="radio" name="lobby-reg-role" value="vip" checked />
              <span style="color:#00f5d4; font-weight:bold;">💎 VIP</span>
            </label>
            <label style="display:flex; align-items:center; gap:6px; padding:6px; border-radius:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); font-size:11px; cursor:pointer;">
              <input type="radio" name="lobby-reg-role" value="standard" />
              <span style="color:#aaa;">🎨 일반</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn-create-room" style="width:100%; background:#c084fc; border-color:#c084fc;">회원가입 완료 및 입장</button>
      </form>

      <div id="lobby-auth-err" style="color:#ff595e; font-size:11px; text-align:center; margin-top:8px; min-height:14px;"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let authToken = localStorage.getItem('qr_auth_token') || '';
    let currentUser = null;
    let currentRoom = null;
    let targetSecretRoom = null;

    // 캔버스 렌더링
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');
    const miniCanvas = document.getElementById('minimap-canvas');
    const miniCtx = miniCanvas.getContext('2d');

    const WORLD_W = 4000;
    const WORLD_H = 3000;
    const graffitiCanvas = document.createElement('canvas');
    graffitiCanvas.width = WORLD_W;
    graffitiCanvas.height = WORLD_H;
    const gCtx = graffitiCanvas.getContext('2d');

    function resetGraffitiBg() {
      gCtx.fillStyle = '#090b12';
      gCtx.fillRect(0, 0, WORLD_W, WORLD_H);
      gCtx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      gCtx.lineWidth = 1;
      for (let x = 0; x < WORLD_W; x += 80) {
        gCtx.beginPath(); gCtx.moveTo(x, 0); gCtx.lineTo(x, WORLD_H); gCtx.stroke();
      }
      for (let y = 0; y < WORLD_H; y += 80) {
        gCtx.beginPath(); gCtx.moveTo(0, y); gCtx.lineTo(WORLD_W, y); gCtx.stroke();
      }
    }
    resetGraffitiBg();

    let camera = { x: WORLD_W / 2, y: WORLD_H / 2, zoom: 0.9 };
    let livePlayers = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      miniCanvas.width = 180;
      miniCanvas.height = 135;
    }
    window.addEventListener('resize', resize);
    resize();

    // ====================================================
    // 1. 인증 & 로비 방 목록 제어
    // ====================================================
    function switchLobbyAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('lobby-tab-btn-login').style.background = isLogin ? '#00f5d4' : 'transparent';
      document.getElementById('lobby-tab-btn-login').style.color = isLogin ? '#000' : '#888';
      document.getElementById('lobby-tab-btn-reg').style.background = !isLogin ? '#c084fc' : 'transparent';
      document.getElementById('lobby-tab-btn-reg').style.color = !isLogin ? '#000' : '#888';
      document.getElementById('lobby-form-login').style.display = isLogin ? 'block' : 'none';
      document.getElementById('lobby-form-reg').style.display = !isLogin ? 'block' : 'none';
      document.getElementById('lobby-auth-err').innerText = '';
    }

    async function handleLobbyLogin(e) {
      e.preventDefault();
      const userId = document.getElementById('lobby-login-id').value.trim();
      const password = document.getElementById('lobby-login-pw').value;
      const errBox = document.getElementById('lobby-auth-err');
      errBox.innerText = '로그인 중...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, password })
        });
        const data = await res.json();
        if (res.ok) {
          authToken = data.token;
          localStorage.setItem('qr_auth_token', authToken);
          errBox.innerText = '';
          await checkLobbyAuth();
        } else {
          errBox.innerText = data.error || '로그인 실패';
        }
      } catch (err) {
        errBox.innerText = '서버 연결 실패';
      }
    }

    async function handleLobbyRegister(e) {
      e.preventDefault();
      const userId = document.getElementById('lobby-reg-id').value.trim();
      const alias = document.getElementById('lobby-reg-alias').value.trim();
      const password = document.getElementById('lobby-reg-pw').value;
      const roleElem = document.querySelector('input[name="lobby-reg-role"]:checked');
      const role = roleElem ? roleElem.value : 'standard';
      const errBox = document.getElementById('lobby-auth-err');
      errBox.innerText = '회원가입 처리 중...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, alias, password, role })
        });
        const data = await res.json();
        if (res.ok) {
          authToken = data.token;
          localStorage.setItem('qr_auth_token', authToken);
          errBox.innerText = '';
          await checkLobbyAuth();
        } else {
          errBox.innerText = data.error || '회원가입 실패';
        }
      } catch (err) {
        errBox.innerText = '서버 연결 실패';
      }
    }

    async function checkLobbyAuth() {
      const bar = document.getElementById('lobby-auth-status');
      if (!authToken) {
        document.getElementById('lobby-login-modal').style.display = 'flex';
        return;
      }
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        if (data.loggedIn) {
          currentUser = data.user;
          const isVip = currentUser.role === 'vip';
          bar.innerHTML = `
            <span>👤 <strong>${currentUser.alias}</strong> (${isVip ? '<span style="color:#00f5d4;">VIP</span>' : '<span style="color:#f15bb5;">일반</span>'})</span>
            <button onclick="logoutLobby()" style="background:none; border:none; color:#888; font-size:12px; cursor:pointer; text-decoration:underline; margin-left:8px;">로그아웃</button>
          `;
          document.getElementById('lobby-login-modal').style.display = 'none';
          loadRoomsList();
        } else {
          document.getElementById('lobby-login-modal').style.display = 'flex';
        }
      } catch (e) {
        document.getElementById('lobby-login-modal').style.display = 'flex';
      }
    }

    async function quickLobbyAuth(userId) {
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, password: '1234' })
        });
        const data = await res.json();
        if (res.ok) {
          authToken = data.token;
          localStorage.setItem('qr_auth_token', authToken);
          await checkLobbyAuth();
        } else {
          document.getElementById('lobby-auth-err').innerText = data.error;
        }
      } catch (e) {
        document.getElementById('lobby-auth-err').innerText = '로그인 오류';
      }
    }

    async function logoutLobby() {
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
      } catch (e) {}
      authToken = '';
      localStorage.removeItem('qr_auth_token');
      currentUser = null;
      document.getElementById('lobby-login-modal').style.display = 'flex';
    }

    async function loadRoomsList() {
      try {
        const res = await fetch('/api/rooms');
        const rooms = await res.json();
        const container = document.getElementById('rooms-container');
        container.innerHTML = '';

        rooms.forEach(r => {
          const card = document.createElement('div');
          card.className = `room-card ${r.isSecret ? 'secret' : ''}`;
          card.onclick = () => onSelectRoom(r);
          card.innerHTML = `
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="background:${r.isSecret ? '#9333ea' : '#00bbf9'}; color:#fff; font-size:11px; font-weight:800; padding:2px 8px; border-radius:6px;">
                  ${r.code}
                </span>
                <span>${r.isSecret ? '🔒 비밀방' : '🌐 공개방'}</span>
              </div>
              <h3 style="font-size:16px; color:#fff; margin-bottom:4px;">${r.title}</h3>
              <p style="font-size:12px; color:#aaa;">개설자: ${r.owner}</p>
            </div>
            <div style="font-size:11px; color:#00f5d4; margin-top:12px; display:flex; justify-content:space-between;">
              <span>누적 획: ${r.strokeCount}개</span>
              <span style="font-weight:bold;">입장하기 →</span>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        console.error(e);
      }
    }

    function onSelectRoom(r) {
      if (r.isSecret) {
        targetSecretRoom = r;
        document.getElementById('secret-target-room-name').innerText = `[${r.code}] ${r.title}`;
        document.getElementById('entry-secret-code').value = '';
        document.getElementById('secret-entry-modal').style.display = 'flex';
      } else {
        enterGameRoom(r.code, r.title);
      }
    }

    async function submitSecretEntry() {
      const code = document.getElementById('entry-secret-code').value.trim();
      if (!code) { alert('비밀 코드를 입력하세요.'); return; }

      try {
        const res = await fetch('/api/rooms/verify-entry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roomCode: targetSecretRoom.code, secretCode: code })
        });
        const data = await res.json();
        if (res.ok) {
          closeSecretEntryModal();
          enterGameRoom(targetSecretRoom.code, targetSecretRoom.title);
        } else {
          alert(data.error);
        }
      } catch (e) {
        alert('입장 검증 오류');
      }
    }
    function closeSecretEntryModal() { document.getElementById('secret-entry-modal').style.display = 'none'; }

    // 새 방 만들기 모달
    function openCreateRoomModal() { document.getElementById('create-room-modal').style.display = 'flex'; }
    function closeCreateRoomModal() { document.getElementById('create-room-modal').style.display = 'none'; }
    function toggleSecretInput(checked) {
      document.getElementById('secret-code-group').style.display = checked ? 'block' : 'none';
    }

    async function submitCreateRoom() {
      const code = document.getElementById('new-room-code').value.trim();
      const title = document.getElementById('new-room-title').value.trim();
      const isSecret = document.getElementById('new-room-is-secret').checked;
      const secretCode = document.getElementById('new-room-secret-code').value.trim();

      if (!code) { alert('방 코드를 입력하세요.'); return; }
      if (isSecret && !secretCode) { alert('비밀방 코드를 입력하세요.'); return; }

      try {
        const res = await fetch('/api/rooms/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ code, title, isSecret, secretCode })
        });
        const data = await res.json();
        if (res.ok) {
          closeCreateRoomModal();
          enterGameRoom(data.room.code, data.room.title);
        } else {
          alert(data.error);
        }
      } catch (e) {
        alert('방 생성 오류');
      }
    }

    // ====================================================
    // 2. 인게임 캔버스 전환 & 카메라 플레이어 팔로우
    // ====================================================
    function enterGameRoom(roomCode, roomTitle) {
      currentRoom = roomCode.toUpperCase();
      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';

      document.getElementById('ingame-room-badge').innerText = currentRoom;
      document.getElementById('ingame-room-title').innerText = roomTitle || `${currentRoom} 캔버스`;
      document.getElementById('modal-room-code-label').innerText = currentRoom;

      resetGraffitiBg();
      socket.emit('join-screen', currentRoom);

      // URL 해시/파라미터 업데이트
      window.history.pushState({}, '', `?room=${encodeURIComponent(currentRoom)}`);
    }

    function leaveToLobby() {
      if (currentRoom) {
        // 대형 화면이 로비로 나갈 때 컨트롤러들에게 방 세션 종료 통보
        socket.emit('screen-leave-room', { room: currentRoom });
      }
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('lobby-screen').style.display = 'flex';
      currentRoom = null;
      loadRoomsList();
      window.history.pushState({}, '', window.location.pathname);
    }

    let currentStrokes = [];

    // DB 누적 캔버스 복원
    socket.on('init-canvas-history', (data) => {
      currentStrokes = data.strokes || [];
      redrawAllStrokes();
      if (data.splats) data.splats.forEach(sp => drawSplat(sp));
    });

    // 캔버스 전체 지우기 (방장 전용 동작 브로드캐스트 수신)
    socket.on('canvas-cleared-all', () => {
      currentStrokes = [];
      resetGraffitiBg();
    });

    // 실시간 지우개에 의한 부분 획 삭제 수신
    socket.on('strokes-erased', (data) => {
      if (!data.removedIds || data.removedIds.length === 0) return;
      const idSet = new Set(data.removedIds);
      currentStrokes = currentStrokes.filter(s => !idSet.has(s.id));
      redrawAllStrokes();
    });

    socket.on('live-stroke-drawn', (s) => {
      currentStrokes.push(s);
      drawStroke(s);
    });
    socket.on('canvas-splat', (sp) => drawSplat(sp));

    function redrawAllStrokes() {
      resetGraffitiBg();
      for (let i = 0; i < currentStrokes.length; i++) {
        drawStroke(currentStrokes[i]);
      }
    }

    function drawStroke(s) {
      gCtx.save();
      gCtx.strokeStyle = s.color || '#00f5d4';
      gCtx.lineWidth = s.width || 8;
      gCtx.lineCap = 'round';
      gCtx.lineJoin = 'round';
      gCtx.shadowColor = s.color;
      gCtx.shadowBlur = 12;
      gCtx.beginPath();
      gCtx.moveTo(s.x1, s.y1);
      gCtx.lineTo(s.x2, s.y2);
      gCtx.stroke();
      gCtx.restore();
    }

    function drawSplat(sp) {
      gCtx.save();
      gCtx.fillStyle = sp.color;
      gCtx.shadowColor = sp.color;
      gCtx.shadowBlur = 24;
      gCtx.beginPath();
      gCtx.arc(sp.x, sp.y, sp.size * 0.6, 0, Math.PI * 2);
      gCtx.fill();
      for (let i = 0; i < 12; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = Math.random() * sp.size * 1.5;
        const r = Math.random() * (sp.size * 0.25) + 3;
        gCtx.beginPath();
        gCtx.arc(sp.x + Math.cos(a) * d, sp.y + Math.sin(a) * d, r, 0, Math.PI * 2);
        gCtx.fill();
      }
      gCtx.restore();
    }

    // 소켓 월드 틱
    socket.on('world-tick', (data) => {
      livePlayers = data.players;
    });

    // 메인 렌더 루프: 카메라가 활성 캐릭터를 부드럽게 추적(Camera Follow)
    function render() {
      if (document.getElementById('game-screen').style.display === 'block') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 내 캐릭터 추적 고정 (플레이어 중 하나를 카메라 중심으로 부드럽게 보간 이동)
        if (livePlayers.length > 0) {
          const targetPlayer = livePlayers[livePlayers.length - 1]; // 최근 활성 플레이어
          const lerp = 0.08;
          camera.x += (targetPlayer.x - camera.x) * lerp;
          camera.y += (targetPlayer.y - camera.y) * lerp;
        }

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        // 오프스크린 그래피티 캔버스 렌더링
        ctx.drawImage(graffitiCanvas, 0, 0);

        // 캔버스 테두리
        ctx.strokeStyle = '#00f5d4';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

        // 실시간 캐릭터 렌더링
        for (const p of livePlayers) {
          ctx.save();
          ctx.translate(p.x, p.y);

          if (p.isErasing) {
            // 🧽 지우개 모드: 선택한 크기의 점선 원 영역 시각화
            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([6, 6]);
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(0, 0, p.eraserRadius || 30, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // 내부 코어
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🧽', 0, 6);
          } else {
            // 일반 네온 발광 오라 (투명 상태면 점선/반투명 아우라로 표시하여 이동 중임을 알림)
            const isTransparent = p.color === 'transparent';
            ctx.fillStyle = isTransparent ? 'rgba(255, 255, 255, 0.25)' : p.color;
            ctx.shadowColor = isTransparent ? '#ffffff' : p.color;
            ctx.shadowBlur = isTransparent ? 10 : 24;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();

            // 캐릭터 내부 코어
            ctx.fillStyle = isTransparent ? '#888888' : '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
          }

          // 닉네임 라벨
          ctx.font = 'bold 14px Pretendard, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#000000';
          ctx.shadowBlur = 6;
          ctx.fillText((p.isAi ? '🤖 ' : '') + (p.nickname || 'Artist') + (p.isErasing ? ` (🧽${p.eraserRadius || 30}px)` : ''), 0, -28);

          // AI 봇 또는 플레이어 말풍선 (Gemini 응답 말풍선)
          if (p.bubbleText) {
            ctx.save();
            ctx.font = 'bold 13px Pretendard, sans-serif';
            const metrics = ctx.measureText(p.bubbleText);
            const padX = 14;
            const bubbleW = metrics.width + padX * 2;
            const bubbleH = 28;
            const bubbleY = -72;

            ctx.fillStyle = 'rgba(15, 12, 32, 0.94)';
            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#c084fc';
            ctx.shadowBlur = 14;

            // 말풍선 사각 박스
            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(-bubbleW / 2, bubbleY, bubbleW, bubbleH, 10);
            } else {
              ctx.rect(-bubbleW / 2, bubbleY, bubbleW, bubbleH);
            }
            ctx.fill();
            ctx.stroke();

            // 말풍선 꼬리표
            ctx.beginPath();
            ctx.moveTo(-6, bubbleY + bubbleH);
            ctx.lineTo(0, bubbleY + bubbleH + 7);
            ctx.lineTo(6, bubbleY + bubbleH);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 텍스트
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 0;
            ctx.fillText(p.bubbleText, 0, bubbleY + 18);
            ctx.restore();
          }

          ctx.restore();
        }

        ctx.restore();
        renderMinimap();
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    function renderMinimap() {
      miniCtx.clearRect(0, 0, 180, 135);
      miniCtx.drawImage(graffitiCanvas, 0, 0, 180, 135);
      miniCtx.strokeStyle = 'rgba(0, 245, 212, 0.4)';
      miniCtx.strokeRect(0, 0, 180, 135);

      for (const p of livePlayers) {
        const mx = (p.x / WORLD_W) * 180;
        const my = (p.y / WORLD_H) * 135;
        miniCtx.fillStyle = p.color;
        miniCtx.shadowColor = p.color;
        miniCtx.shadowBlur = 6;
        miniCtx.beginPath();
        miniCtx.arc(mx, my, 4, 0, Math.PI * 2);
        miniCtx.fill();
      }

      const vx = ((camera.x - (canvas.width / 2 / camera.zoom)) / WORLD_W) * 180;
      const vy = ((camera.y - (canvas.height / 2 / camera.zoom)) / WORLD_H) * 135;
      const vw = ((canvas.width / camera.zoom) / WORLD_W) * 180;
      const vh = ((canvas.height / camera.zoom) / WORLD_H) * 135;
      miniCtx.strokeStyle = '#ffffff';
      miniCtx.lineWidth = 1.5;
      miniCtx.strokeRect(vx, vy, vw, vh);
    }

    // ====================================================
    // 3. QR 모달 & 가상 컨트롤러
    // ====================================================
    function openQrModal() {
      fetch(`/api/qr?room=${encodeURIComponent(currentRoom)}`)
        .then(r => r.json())
        .then(data => {
          const container = document.getElementById('modal-qr-container');
          container.innerHTML = '';
          new QRCode(container, {
            text: data.controllerUrl,
            width: 220,
            height: 220,
            colorDark: '#000000',
            colorLight: '#ffffff'
          });
          document.getElementById('modal-qr-url').innerText = data.controllerUrl;
          document.getElementById('qr-modal').style.display = 'flex';
        });
    }
    function closeQrModal() { document.getElementById('qr-modal').style.display = 'none'; }

    function toggleVirtualController() {
      const container = document.getElementById('virtual-phone-container');
      const frame = document.getElementById('virtual-phone-frame');
      const isHidden = container.style.display === 'none' || !container.style.display;
      if (isHidden) {
        frame.src = `controller.html?room=${encodeURIComponent(currentRoom)}`;
        container.style.display = 'flex';
      } else {
        container.style.display = 'none';
        frame.src = '';
      }
    }

    function openControllerNewTab() {
      window.open(`/controller.html?room=${encodeURIComponent(currentRoom)}`, '_blank', 'width=420,height=750');
    }

    // ====================================================
    // 4. AI 큐레이터 실시간 비평 배너
    // ====================================================
    const docentBanner = document.getElementById('ai-docent-banner');
    const commentText = document.getElementById('ai-comment-text');
    const metaTag = document.getElementById('ai-meta-tag');
    let bannerTimer = null;

    socket.on('ai-docent-broadcast', (data) => {
      commentText.innerText = data.comment;
      metaTag.innerText = `분석 아티스트: ${data.author || 'AI'}`;
      docentBanner.style.display = 'block';

      if (bannerTimer) clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => docentBanner.style.display = 'none', 8000);
    });

    // 시작 시 인증 및 로비 확인
    checkLobbyAuth();

    // 만약 URL 파라미터에 이미 ?room=... 이 지정되어 들어온 경우 바로 입장 지원
    const initialRoomParam = params.get('room');
    if (initialRoomParam && authToken) {
      enterGameRoom(initialRoomParam, initialRoomParam);
    }
  </script>
