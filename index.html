<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Multi-Player Portal</title>
  <!-- PeerJS for Serverless WebRTC P2P communication -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- QRCode Generator in Browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fafafa;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ================= STATE 1: LONELY QR VIEW ================= */
    #qr-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      z-index: 20;
      transition: opacity 0.7s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #qr-stage.unlocked {
      opacity: 0;
      transform: scale(2.4) rotate(8deg);
      pointer-events: none;
    }

    .qr-box {
      position: relative;
      padding: 24px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 308px;
      min-height: 308px;
    }

    .qr-box:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.12);
    }

    #qr-container img, #qr-container canvas {
      display: block !important;
      width: 260px !important;
      height: 260px !important;
      border-radius: 8px;
    }

    .qr-box::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 34px;
      border: 1.5px solid rgba(0, 0, 0, 0.06);
      animation: breathe 3s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.04); opacity: 0; }
    }

    .loading-text {
      font-size: 13px;
      color: #999;
      position: absolute;
    }

    .sim-hint {
      position: fixed;
      bottom: 18px;
      font-size: 12px;
      color: #c0c0c0;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #qr-stage:hover .sim-hint {
      opacity: 1;
    }

    /* ================= STATE 2: TRANSFORMED STAGE ================= */
    #arcade-stage {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #15192b 0%, #070810 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      overflow: hidden;
    }

    #arcade-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    #stage-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Overlay on Big Screen */
    .hud-top {
      position: absolute;
      top: 24px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #00f5d4;
      box-shadow: 0 0 12px #00f5d4;
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .mode-indicator {
      padding: 8px 18px;
      background: linear-gradient(135deg, rgba(123, 44, 191, 0.4), rgba(0, 245, 212, 0.25));
      border: 1px solid rgba(0, 245, 212, 0.4);
      border-radius: 999px;
      color: #00f5d4;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      box-shadow: 0 0 24px rgba(0, 245, 212, 0.2);
    }

    /* Connected Players Roster */
    .player-roster {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 600px;
    }

    .player-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      background: rgba(12, 15, 28, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .player-chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }

    .score-pill {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: #fee440;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    /* Always-visible Join QR Card so new players can scan & join anytime! */
    .join-qr-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px 8px 8px;
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .join-qr-card:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    #mini-qr-container {
      width: 58px;
      height: 58px;
      background: #fff;
      padding: 4px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #mini-qr-container img, #mini-qr-container canvas {
      width: 50px !important;
      height: 50px !important;
      display: block !important;
    }

    .reset-btn {
      padding: 10px 14px;
      background: rgba(255, 89, 94, 0.15);
      border: 1px solid rgba(255, 89, 94, 0.4);
      border-radius: 14px;
      color: #ff595e;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reset-btn:hover {
      background: rgba(255, 89, 94, 0.3);
    }

    .about-link {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
    }

    .about-link:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .qr-about-link {
      position: fixed;
      bottom: 44px;
      font-size: 12px;
      color: #888;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.8);
      opacity: 0;
      transition: opacity 0.3s, color 0.2s;
    }

    #qr-stage:hover .qr-about-link {
      opacity: 1;
    }

    .qr-about-link:hover {
      color: #111;
    }

    /* Big Center Announcement Banner on Transformation */
    #unlock-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      z-index: 15;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #unlock-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #unlock-banner h1 {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #00f5d4, #fee440, #f15bb5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 10px 30px rgba(0, 245, 212, 0.4));
    }

    #unlock-banner p {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 20px;
      font-weight: 500;
    }

    .hud-bottom {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      background: rgba(10, 12, 22, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- 1. INITIAL LONELY QR PAGE -->
  <div id="qr-stage">
    <div class="qr-box" id="qr-box" title="스마트폰으로 스캔하거나 클릭하여 테스트 컨트롤러 열기">
      <span class="loading-text" id="qr-loading">QR 생성 중...</span>
      <div id="qr-container"></div>
    </div>
    <a href="about.html" class="qr-about-link">💡 이 페이지는 어떻게 작동하나요? (구조 보기)</a>
    <div class="sim-hint">스마트폰 카메라로 스캔하세요 (PC에서 바로 테스트하려면 QR 클릭)</div>
  </div>

  <!-- 2. TRANSFORMED MULTI-PLAYER INTERACTIVE STAGE -->
  <div id="arcade-stage">
    <div class="hud-top">
      <div class="hud-left">
        <div class="badge-group">
          <div class="live-badge">
            <span class="live-dot"></span>
            <span id="player-status">1 PLAYER ONLINE</span>
          </div>
          <div class="mode-indicator" id="mode-badge">MODE: NEON CANVAS</div>
        </div>
        <div class="player-roster" id="player-roster"></div>
      </div>

      <div class="hud-right">
        <div class="score-pill" id="score-display">SCORE: 0</div>
        <div class="join-qr-card" id="add-player-card" title="스마트폰으로 스캔하거나 클릭하여 새 플레이어 추가">
          <div id="mini-qr-container"></div>
          <div>
            <div style="font-weight:800; font-size:13px; color:#00f5d4;">+ 멀티플레이 참여</div>
            <div style="font-size:11px; opacity:0.75; margin-top:2px;">QR 스캔 시 내 커서 생성!</div>
          </div>
        </div>
        <a href="about.html" class="about-link">💡 작동 원리</a>
        <button class="reset-btn" id="reset-btn">처음으로</button>
      </div>
    </div>

    <div id="unlock-banner">
      <h1 id="banner-title">PORTAL UNLOCKED!</h1>
      <p id="banner-sub">스마트폰으로 각자의 커서를 조종해보세요</p>
    </div>

    <canvas id="stage-canvas"></canvas>

    <div class="hud-bottom" id="hud-tip">
      📱 여러 명이 우측 상단 QR을 찍고 들어오면 각자 자기만의 커서와 패들로 동시에 플레이할 수 있습니다!
    </div>
  </div>

  <script>
    const qrStage = document.getElementById('qr-stage');
    const arcadeStage = document.getElementById('arcade-stage');
    const qrContainer = document.getElementById('qr-container');
    const miniQrContainer = document.getElementById('mini-qr-container');
    const qrLoading = document.getElementById('qr-loading');
    const qrBox = document.getElementById('qr-box');
    const addPlayerCard = document.getElementById('add-player-card');
    const resetBtn = document.getElementById('reset-btn');
    const unlockBanner = document.getElementById('unlock-banner');
    const bannerTitle = document.getElementById('banner-title');
    const bannerSub = document.getElementById('banner-sub');
    const modeBadge = document.getElementById('mode-badge');
    const scoreDisplay = document.getElementById('score-display');
    const playerStatus = document.getElementById('player-status');
    const playerRoster = document.getElementById('player-roster');

    let controllerUrl = '';
    let isUnlocked = false;
    let currentMode = 'canvas'; // 'canvas' | 'arcade' | 'fireworks'
    let score = 0;

    const PLAYER_PALETTE = ['#00f5d4', '#f15bb5', '#fee440', '#00bbf9', '#9b5de5', '#ff595e'];

    // Multi-player state map: playerId -> player object
    const players = new Map();

    // Web Audio Synth for sound effects
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'unlock') {
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0.15, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.35);
          });
        } else if (type === 'splat') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180 + Math.random() * 250, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.18);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'firework') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.25);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'hit') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(440 + Math.random() * 220, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }
      } catch (e) {}
    }

    function updateRosterUI() {
      const count = players.size;
      playerStatus.textContent = `${count} PLAYER${count === 1 ? '' : 'S'} ONLINE`;
      playerRoster.innerHTML = '';
      players.forEach((p) => {
        const chip = document.createElement('div');
        chip.className = 'player-chip';
        chip.style.borderColor = `${p.color}88`;
        chip.innerHTML = `<span class="player-chip-dot" style="background:${p.color}; box-shadow: 0 0 8px ${p.color}"></span><span>${p.nickname}</span>`;
        playerRoster.appendChild(chip);
      });
    }

    function getOrCreatePlayer(playerId, nickname, preferredColor) {
      if (players.has(playerId)) {
        const existing = players.get(playerId);
        if (nickname) existing.nickname = nickname;
        if (preferredColor) existing.color = preferredColor;
        updateRosterUI();
        return { player: existing, isNew: false };
      }

      const playerIndex = players.size;
      const assignedColor = preferredColor || PLAYER_PALETTE[playerIndex % PLAYER_PALETTE.length];
      const assignedName = nickname || `P${playerIndex + 1}`;

      // Spread initial spawn positions so cursors don't overlap
      const angle = (playerIndex * Math.PI * 2) / 6;
      const spawnRadius = Math.min(canvas.width, canvas.height) * 0.16;
      const startX = canvas.width / 2 + Math.cos(angle) * spawnRadius;
      const startY = canvas.height / 2 + Math.sin(angle) * spawnRadius;

      const newPlayer = {
        id: playerId,
        nickname: assignedName,
        color: assignedColor,
        x: startX,
        y: startY,
        vx: 0,
        vy: 0,
        radius: 18,
        paddleX: Math.max(40, Math.min(canvas.width - 200, startX - 80)),
        paddleWidth: 160,
        trail: [],
        score: 0
      };

      players.set(playerId, newPlayer);
      updateRosterUI();
      return { player: newPlayer, isNew: true };
    }

    function removePlayer(playerId) {
      if (players.has(playerId)) {
        players.delete(playerId);
        updateRosterUI();
      }
    }

    // ================= PEERJS (WEBRTC) SETUP =================
    const roomId = 'qrcon-' + Math.random().toString(36).substring(2, 9);
    const peer = new Peer(roomId, { debug: 1 });

    peer.on('open', (id) => {
      qrLoading.style.display = 'none';
      const basePath = window.location.origin + window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
      controllerUrl = `${basePath}/controller.html?peer=${encodeURIComponent(id)}`;

      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: controllerUrl,
        width: 260,
        height: 260,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      miniQrContainer.innerHTML = '';
      new QRCode(miniQrContainer, {
        text: controllerUrl,
        width: 50,
        height: 50,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.L
      });
    });

    peer.on('connection', (conn) => {
      let boundPlayerId = null;

      conn.on('data', (msg) => {
        if (!msg || !msg.event) return;
        const pid = msg.playerId || conn.peer;
        boundPlayerId = pid;

        if (msg.event === 'join-controller') {
          const { player, isNew } = getOrCreatePlayer(pid, msg.nickname, msg.color);

          // Send assigned color & player info back to phone so phone UI matches!
          if (conn.open) {
            conn.send({
              event: 'assigned-profile',
              nickname: player.nickname,
              color: player.color
            });
          }

          if (!isUnlocked) {
            unlockStage(player.nickname);
          } else if (isNew) {
            showBanner(`${player.nickname} 참전! 🎮`, '각자의 커서를 동시에 조종할 수 있습니다');
            spawnFirework(player.x, player.y, player.color, 65);
          }
        } else if (msg.event === 'switch-mode') {
          switchMode(msg.mode);
        } else if (msg.event === 'reset-to-qr') {
          resetToLonelyQr();
        } else if (msg.event === 'controller-action') {
          handleControllerAction(pid, msg);
        }
      });

      conn.on('close', () => {
        if (boundPlayerId) removePlayer(boundPlayerId);
      });
    });

    // Clicking the QR on PC opens a simulated phone controller popup (with unique sim ID each click!)
    function openSimController() {
      initAudio();
      if (controllerUrl) {
        const simId = 'sim-' + Math.random().toString(36).substring(2, 7);
        window.open(
          `${controllerUrl}&sim=${simId}`,
          `PhoneController_${simId}`,
          `width=410,height=780,left=${80 + players.size * 40},top=${80 + players.size * 30}`
        );
      }
    }

    qrBox.addEventListener('click', openSimController);
    addPlayerCard.addEventListener('click', openSimController);

    resetBtn.addEventListener('click', () => {
      resetToLonelyQr();
    });

    function showBanner(title, sub) {
      bannerTitle.textContent = title;
      bannerSub.textContent = sub;
      unlockBanner.classList.add('show');
      setTimeout(() => {
        unlockBanner.classList.remove('show');
      }, 2200);
    }

    function unlockStage(nickname) {
      isUnlocked = true;
      qrStage.classList.add('unlocked');
      arcadeStage.classList.add('active');
      playSound('unlock');
      showBanner('PORTAL UNLOCKED!', `${nickname}님이 스테이지를 열었습니다!`);

      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          spawnFirework(
            canvas.width * (0.25 + Math.random() * 0.5),
            canvas.height * (0.25 + Math.random() * 0.4),
            PLAYER_PALETTE[i % PLAYER_PALETTE.length],
            65
          );
        }, i * 180);
      }
    }

    function resetToLonelyQr() {
      isUnlocked = false;
      qrStage.classList.remove('unlocked');
      arcadeStage.classList.remove('active');
      splats.length = 0;
      particles.length = 0;
      floatingTexts.length = 0;
    }

    // ================= MULTI-PLAYER CANVAS & ARCADE ENGINE =================
    const canvas = document.getElementById('stage-canvas');
    const ctx = canvas.getContext('2d');

    const particles = [];
    const splats = [];
    const floatingTexts = [];
    const ball = { x: 500, y: 400, vx: 6, vy: -6, radius: 11, lastHitColor: '#00f5d4' };
    let bricks = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initBricks();
    }
    window.addEventListener('resize', resize);

    function initBricks() {
      bricks = [];
      const rows = 5;
      const cols = 9;
      const pad = 12;
      const offsetTop = 120;
      const offsetLeft = 80;
      const totalW = canvas.width - offsetLeft * 2;
      const brickW = (totalW - pad * (cols - 1)) / cols;
      const brickH = 28;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: offsetLeft + c * (brickW + pad),
            y: offsetTop + r * (brickH + pad),
            w: brickW,
            h: brickH,
            color: PLAYER_PALETTE[r % PLAYER_PALETTE.length],
            alive: true
          });
        }
      }
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 140;
      ball.vx = 6 * (Math.random() > 0.5 ? 1 : -1);
      ball.vy = -6.5;
    }

    resize();

    function switchMode(mode) {
      currentMode = mode;
      if (mode === 'canvas') {
        modeBadge.textContent = 'MODE: MULTI GRAFFITI CANVAS';
        showBanner('MULTI GRAFFITI', '모두 각자의 브러시로 동시에 그림을 그리고 물감 폭탄을 던지세요!');
      } else if (mode === 'arcade') {
        modeBadge.textContent = 'MODE: CO-OP BRICK BREAKER';
        initBricks();
        showBanner('CO-OP ARCADE!', '여러 명이 각자의 패들을 움직여 협동으로 벽돌을 깨세요!');
      } else if (mode === 'fireworks') {
        modeBadge.textContent = 'MODE: SKY FIREWORKS SHOW';
        showBanner('FIREWORKS SHOW', '다 함께 밤하늘에 불꽃을 쏘아올리세요!');
      }
      playSound('unlock');
    }

    function spawnFirework(x, y, color, count = 55) {
      playSound('firework');
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
        const speed = 2 + Math.random() * 9;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          alpha: 1,
          size: 3 + Math.random() * 4,
          gravity: 0.08
        });
      }
    }

    function spawnPaintSplat(x, y, color) {
      playSound('splat');
      const blobs = [];
      const mainRadius = 26 + Math.random() * 32;
      for (let i = 0; i < 14; i++) {
        const ang = Math.random() * Math.PI * 2;
        const dist = mainRadius * (0.6 + Math.random() * 0.9);
        blobs.push({
          dx: Math.cos(ang) * dist,
          dy: Math.sin(ang) * dist,
          r: 4 + Math.random() * 14
        });
      }
      splats.push({ x, y, r: mainRadius, color, blobs });
      if (splats.length > 80) splats.shift();

      score += 10;
      scoreDisplay.textContent = `SCORE: ${score}`;
    }

    function handleControllerAction(playerId, payload) {
      const { player } = getOrCreatePlayer(playerId, payload.nickname, payload.color);

      if (!isUnlocked) {
        unlockStage(player.nickname);
      }

      if (payload.color) {
        player.color = payload.color;
        updateRosterUI();
      }
      if (payload.nickname && payload.nickname !== player.nickname) {
        player.nickname = payload.nickname;
        updateRosterUI();
      }

      switch (payload.type) {
        case 'joystick': {
          player.vx = payload.dx * 12;
          player.vy = payload.dy * 12;
          break;
        }
        case 'splat': {
          spawnPaintSplat(player.x, player.y, player.color);
          spawnFirework(player.x, player.y, player.color, 25);
          break;
        }
        case 'firework': {
          const fx = player.x + (Math.random() - 0.5) * 180;
          const fy = Math.max(120, player.y - 100 - Math.random() * 150);
          spawnFirework(fx, fy, player.color, 70);
          score += 25;
          scoreDisplay.textContent = `SCORE: ${score}`;
          break;
        }
        case 'emoji': {
          floatingTexts.push({
            text: payload.emoji || '🚀',
            x: player.x + (Math.random() - 0.5) * 40,
            y: player.y - 20,
            vy: -3.5 - Math.random() * 2,
            alpha: 1,
            size: 52
          });
          playSound('hit');
          break;
        }
        case 'message': {
          floatingTexts.push({
            text: `${player.nickname}: ${payload.text}`,
            x: player.x,
            y: player.y - 30,
            vy: -2.2,
            alpha: 1,
            size: 34,
            color: player.color
          });
          spawnFirework(player.x, player.y, player.color, 45);
          break;
        }
        case 'clear': {
          splats.length = 0;
          players.forEach((p) => (p.trail.length = 0));
          showBanner('CANVAS CLEARED', `${player.nickname}님이 캔버스를 초기화했습니다`);
          break;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!isUnlocked) return;

      ctx.fillStyle = currentMode === 'fireworks' ? 'rgba(7, 8, 16, 0.22)' : 'rgba(10, 12, 24, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Paint Splats (in Canvas mode)
      if (currentMode === 'canvas') {
        for (const s of splats) {
          ctx.save();
          ctx.fillStyle = s.color;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();

          for (const b of s.blobs) {
            ctx.beginPath();
            ctx.arc(s.x + b.dx, s.y + b.dy, b.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // 2. Update each player's independent cursor & trail
      players.forEach((p) => {
        p.x = Math.max(28, Math.min(canvas.width - 28, p.x + p.vx));
        p.y = Math.max(28, Math.min(canvas.height - 28, p.y + p.vy));
        p.paddleX = Math.max(20, Math.min(canvas.width - p.paddleWidth - 20, p.paddleX + p.vx * 1.4));

        if (Math.hypot(p.vx, p.vy) > 0.5) {
          p.trail.push({ x: p.x, y: p.y, color: p.color, life: 1 });
          if (p.trail.length > 65) p.trail.shift();

          if (currentMode === 'fireworks' && Math.random() < 0.28) {
            particles.push({
              x: p.x,
              y: p.y,
              vx: (Math.random() - 0.5) * 4,
              vy: (Math.random() - 0.5) * 4,
              color: p.color,
              alpha: 1,
              size: 3,
              gravity: 0.04
            });
          }
        }

        // Draw Player Trail
        for (let i = 0; i < p.trail.length; i++) {
          const t = p.trail[i];
          t.life -= 0.018;
          if (t.life <= 0) continue;
          ctx.save();
          ctx.fillStyle = t.color;
          ctx.globalAlpha = t.life * 0.7;
          ctx.beginPath();
          ctx.arc(t.x, t.y, 10 * t.life, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Draw Player Cursor + Nickname Tag (in Canvas & Fireworks mode)
        if (currentMode !== 'arcade') {
          ctx.save();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 24;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Player Nickname Tag above cursor
          ctx.font = '800 13px Pretendard, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 8;
          ctx.fillText(p.nickname, p.x, p.y - p.radius - 10);
          ctx.restore();
        }
      });

      // 3. Co-op Arcade Brick Breaker (Each player has their own paddle!)
      if (currentMode === 'arcade') {
        const paddleY = canvas.height - 78;
        const paddleH = 18;

        players.forEach((p) => {
          ctx.save();
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.roundRect(p.paddleX, paddleY, p.paddleWidth, paddleH, 9);
          ctx.fill();

          ctx.font = '800 12px Pretendard, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(p.nickname, p.paddleX + p.paddleWidth / 2, paddleY + 34);
          ctx.restore();

          // Check ball collision with this player's paddle
          if (
            ball.vy > 0 &&
            ball.y + ball.radius >= paddleY &&
            ball.y - ball.radius <= paddleY + paddleH &&
            ball.x >= p.paddleX &&
            ball.x <= p.paddleX + p.paddleWidth
          ) {
            const hitOffset = (ball.x - (p.paddleX + p.paddleWidth / 2)) / (p.paddleWidth / 2);
            ball.vx = hitOffset * 8.5;
            ball.vy = -Math.abs(ball.vy);
            ball.lastHitColor = p.color;
            playSound('hit');
            spawnFirework(ball.x, ball.y, p.color, 18);
          }
        });

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
          ball.vx *= -1;
          playSound('hit');
        }
        if (ball.y - ball.radius < 0) {
          ball.vy *= -1;
          playSound('hit');
        }

        if (ball.y > canvas.height + 30) {
          const firstPlayer = players.values().next().value;
          ball.x = firstPlayer ? firstPlayer.paddleX + firstPlayer.paddleWidth / 2 : canvas.width / 2;
          ball.y = canvas.height - 120;
          ball.vy = -6.5;
        }

        let aliveCount = 0;
        for (const b of bricks) {
          if (!b.alive) continue;
          aliveCount++;

          if (
            ball.x + ball.radius > b.x &&
            ball.x - ball.radius < b.x + b.w &&
            ball.y + ball.radius > b.y &&
            ball.y - ball.radius < b.y + b.h
          ) {
            b.alive = false;
            ball.vy *= -1;
            score += 50;
            scoreDisplay.textContent = `SCORE: ${score}`;
            spawnFirework(b.x + b.w / 2, b.y + b.h / 2, b.color, 28);
          }

          ctx.save();
          ctx.fillStyle = b.color;
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 6);
          ctx.fill();
          ctx.restore();
        }

        if (aliveCount === 0) {
          initBricks();
          showBanner('STAGE CLEAR! 🎉', '협동 보너스 +500점 획득!');
          score += 500;
          scoreDisplay.textContent = `SCORE: ${score}`;
        }

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = ball.lastHitColor;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 4. Firework Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.alpha -= 0.016;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 5. Floating Emojis & Messages
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.008;
        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.font = `800 ${ft.size}px Pretendard, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = ft.color || '#ffffff';
        ctx.shadowColor = ft.color || '#00f5d4';
        ctx.shadowBlur = 16;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }
    }

    animate();
  </script>
</body>
</html>
