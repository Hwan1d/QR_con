<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Graffiti Gamepad Controller</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="supabase-adapter.js"></script>
  <link rel="stylesheet" href="/css/controller.css" />
</head>
<body>

  <!-- 상단 바 -->
  <div class="top-bar">
    <div class="room-row">
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="room-badge" id="room-code-tag">LOBBY</span>
        <button onclick="promptSwitchRoom()" style="background:none; border:none; color:#00f5d4; font-size:11px; text-decoration:underline; cursor:pointer;">방 변경</button>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="user-tag" id="user-alias-label">미로그인</span>
        <button id="btn-auth-open" onclick="openAuthModal()" style="background:rgba(0,245,212,0.15); border:1px solid #00f5d4; border-radius:6px; color:#00f5d4; font-size:10px; font-weight:700; padding:3px 7px; cursor:pointer;">로그인</button>
        <button id="btn-logout" onclick="logoutAuth()" style="display:none; background:rgba(255,89,94,0.15); border:1px solid #ff595e; border-radius:6px; color:#ff595e; font-size:10px; font-weight:700; padding:3px 7px; cursor:pointer;">로그아웃</button>
      </div>
    </div>

    <!-- 듀얼 모드 전환 탭 -->
    <div class="mode-tab-bar">
      <button class="mode-tab-btn active" id="tab-joystick" onclick="switchMode('joystick')">🕹️ 조이스틱</button>
      <button class="mode-tab-btn" id="tab-canvas" onclick="switchMode('canvas')">🖌️ 터치 패드</button>
    </div>

    <!-- 팔레트 (도구 및 색상 선택) -->
    <div class="palette">
      <span style="font-size:11px; opacity:0.6; margin-right:4px;">도구:</span>
      <div class="swatch swatch-eraser" id="swatch-eraser" data-color="eraser" title="지우개 (내가 그린 선 부분 지우기)">🧽</div>
      <div class="swatch swatch-transparent" id="swatch-none" data-color="transparent" title="선 끄기 (이동만)">🚫</div>
      <div class="swatch active" style="background:#00f5d4; color:#00f5d4" data-color="#00f5d4"></div>
      <div class="swatch" style="background:#f15bb5; color:#f15bb5" data-color="#f15bb5"></div>
      <div class="swatch" style="background:#fee440; color:#fee440" data-color="#fee440"></div>
      <div class="swatch" style="background:#00bbf9; color:#00bbf9" data-color="#00bbf9"></div>
      <div class="swatch" style="background:#9b5de5; color:#9b5de5" data-color="#9b5de5"></div>
      <div class="swatch" style="background:#ff595e; color:#ff595e" data-color="#ff595e"></div>
    </div>

    <!-- 지우개 선택 시 나타나는 크기 조절 바 -->
    <div class="eraser-size-bar" id="eraser-size-bar">
      <span style="font-size:11px; color:#aaa;">크기:</span>
      <button class="btn-eraser-size" id="btn-size-15" onclick="setEraserSize(15)">소 (15px)</button>
      <button class="btn-eraser-size active" id="btn-size-30" onclick="setEraserSize(30)">중 (30px)</button>
      <button class="btn-eraser-size" id="btn-size-60" onclick="setEraserSize(60)">대 (60px)</button>
    </div>
  </div>

  <!-- 중앙 메인 뷰 -->
  <div class="center-view">
    <!-- 뷰 1: 가변 감도 조이스틱 -->
    <div id="joystick-view">
      <div style="font-size:11px; opacity:0.6; margin-bottom:8px; text-align:center;">
        🕹️ 당긴 만큼 비례하여 이동합니다 (놓으면 정지)
      </div>
      <div class="joystick-zone" id="joy-zone">
        <div class="joystick-stick" id="joy-stick"></div>
      </div>
    </div>

    <!-- 뷰 2: 내 화면 중심 터치 드로잉 패드 -->
    <div id="canvas-view">
      <div style="position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:11px; color:#aaa; pointer-events:none;">
        🖌️ 내 캐릭터 위치를 중심으로 그려집니다
      </div>
      <canvas id="touch-draw-canvas"></canvas>
    </div>
  </div>

  <!-- 하단 도구: 일반 유저 지우기 & AI 인터랙션 & 방장 전용 관리 패널 -->
  <div class="bottom-tools">

    <!-- 1. 지우기: 내 모든 선 한 번에 지우기 (소유권 RLS) -->
    <button class="btn-clear-mine" onclick="clearMyDrawings()">
      <span>🧹 내가 그린 모든 선 한 번에 지우기</span>
    </button>

    <!-- 2. 실제 Gemini 3.5 Flash 연동 AI 봇 액션 -->
    <div class="ai-action-row">
      <button class="btn-ai-action" onclick="askAiCritic()">
        <span>💬 AI 봇의 한마디</span>
      </button>
      <button class="btn-ai-action" onclick="promptAiDrawing()">
        <span>🎨 AI에게 그림 요청</span>
      </button>
    </div>

    <!-- 2. 방장(Owner) / 최고관리자 전용 관리 패널: AI 봇 생성/삭제 & 캔버스 전체 지우기 -->
    <div class="owner-panel" id="owner-panel" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="color:#c084fc; font-weight:800;" id="owner-title-tag">👑 관리자 전용</span>
        <span id="ai-bot-count" style="color:#aaa;">AI 봇: 0/2</span>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn-owner" style="background:#9333ea; color:#fff; flex:1;" onclick="spawnAiBot()">+ AI 봇 소환</button>
        <button class="btn-owner" style="background:rgba(255,255,255,0.15); color:#fff; flex:1;" onclick="removeAiBot()">- AI 봇 삭제</button>
        <button class="btn-owner" style="background:#ff595e; color:#fff; flex:1.2;" onclick="clearAllCanvas()">⚠️ 전체 지우기</button>
      </div>
    </div>
      </div>
    </div>

    <div id="bottom-feedback" style="font-size:11px; text-align:center; color:#00f5d4; min-height:14px;"></div>
  </div>

  <!-- 인증 모달: 로그인 & 회원가입 탭 -->
  <div class="modal-overlay" id="auth-modal" style="display:none;">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="color:#00f5d4; font-size:16px; margin:0;">🎨 아티스트 인증 센터</h3>
        <button onclick="closeAuthModal()" style="background:none; border:none; color:#888; font-size:18px; cursor:pointer;">✕</button>
      </div>

      <!-- 탭 바 -->
      <div class="auth-tab-bar">
        <button class="auth-tab-btn active" id="btn-tab-login" onclick="switchAuthTab('login')">🔑 로그인</button>
        <button class="auth-tab-btn" id="btn-tab-register" onclick="switchAuthTab('register')">✨ 회원가입</button>
      </div>

      <!-- 1. 로그인 폼 -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)" style="display:block;">
        <div class="auth-input-group">
          <label>아티스트 아이디</label>
          <input type="text" id="login-userId" class="auth-input" placeholder="아이디 입력 (예: user_a)" required />
        </div>
        <div class="auth-input-group">
          <label>비밀번호</label>
          <input type="password" id="login-password" class="auth-input" placeholder="비밀번호 입력" required />
        </div>
        <button type="submit" class="btn-auth-submit">입장하기 (로그인)</button>

        <div style="margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.08);">
          <div style="font-size:11px; opacity:0.6; margin-bottom:8px; text-align:center;">빠른 테스트 계정으로 로그인:</div>
          <div style="display:flex; gap:6px;">
            <button type="button" onclick="quickAuth('user_a')" style="flex:1; padding:7px; border-radius:8px; border:1px solid #00f5d4; background:rgba(0,245,212,0.12); color:#00f5d4; font-size:11px; font-weight:700; cursor:pointer;">
              👑 user_a (VIP/방장)
            </button>
            <button type="button" onclick="quickAuth('user_b')" style="flex:1; padding:7px; border-radius:8px; border:1px solid #f15bb5; background:rgba(241,91,181,0.12); color:#f15bb5; font-size:11px; font-weight:700; cursor:pointer;">
              🎨 user_b (일반)
            </button>
          </div>
        </div>
      </form>

      <!-- 2. 회원가입 폼 -->
      <form id="form-register" onsubmit="handleRegisterSubmit(event)" style="display:none;">
        <div class="auth-input-group">
          <label>새 아티스트 아이디</label>
          <input type="text" id="reg-userId" class="auth-input" placeholder="영문/숫자 아이디 (예: neo_artist)" required />
        </div>
        <div class="auth-input-group">
          <label>닉네임 / 활동명</label>
          <input type="text" id="reg-alias" class="auth-input" placeholder="화면에 표시될 이름 (예: 사이버뱅크시)" required />
        </div>
        <div class="auth-input-group">
          <label>비밀번호</label>
          <input type="password" id="reg-password" class="auth-input" placeholder="비밀번호 입력" required />
        </div>
        <div class="auth-input-group">
          <label>아티스트 등급 선택</label>
          <div class="role-options">
            <label class="role-option-label">
              <input type="radio" name="reg-role" value="vip" checked />
              <span style="color:#00f5d4; font-weight:700;">💎 VIP 아티스트</span>
            </label>
            <label class="role-option-label">
              <input type="radio" name="reg-role" value="standard" />
              <span style="color:#aaa;">🎨 일반 아티스트</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn-auth-submit" style="background:#c084fc; box-shadow:0 0 15px rgba(192,132,252,0.4);">
          회원가입 완료 및 입장
        </button>
      </form>

      <div id="auth-error-msg" style="color:#ff595e; font-size:11px; text-align:center; margin-top:10px; min-height:14px;"></div>
    </div>
  </div>

  <!-- 화면 퇴장 시 자동 컨트롤러 연결 끊김 안내 오버레이 -->
  <div class="modal-overlay" id="session-ended-overlay" style="display:none; z-index:9999; text-align:center;">
    <div class="modal-card" style="border-color:#ff595e; box-shadow:0 0 40px rgba(255,89,94,0.35);">
      <div style="font-size:38px; margin-bottom:10px;">🚪</div>
      <h3 style="color:#ff595e; font-size:17px; margin-bottom:8px;">컨트롤러 연결이 해제되었습니다</h3>
      <p style="font-size:12px; opacity:0.85; line-height:1.5; margin-bottom:14px;" id="session-ended-reason">
        대형 화면이 로비로 이동하였거나 방이 종료되었습니다.
      </p>
      <div style="font-size:11px; color:#aaa; line-height:1.4; margin-bottom:18px; background:rgba(0,0,0,0.3); padding:10px; border-radius:10px;">
        다른 방으로 이동하셨다면, 해당 대형 화면에 새로 표시된 <strong>새로운 방의 QR 코드</strong>를 스캔하여 컨트롤러를 다시 연결해 주세요.
      </div>
      <button onclick="window.location.reload()" style="width:100%; padding:12px; border-radius:10px; border:none; background:#ff595e; color:#fff; font-weight:800; cursor:pointer;">
        🔄 새로고침 / 다시 연결
      </button>
    </div>
  </div>

  <script src="/js/controller.js"></script>
</body>
</html>
