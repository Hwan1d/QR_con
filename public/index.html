<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Graffiti Rooms & Art Platform</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="supabase-adapter.js"></script>
  <link rel="stylesheet" href="/css/screen.css" />
</head>
<body>

  <!-- ====================================================
       화면 1: 첫 화면 (로그인 / 회원가입 + 룸 로비)
       ==================================================== -->
  <div id="lobby-screen">
    <div class="lobby-header">
      <div class="brand-title">
        <span>🎨 Infinite Graffiti IO</span>
      </div>
      <div class="lobby-user-bar">
        <div id="lobby-auth-status" style="font-size: 13px;">
          <!-- 로그인 상태 렌더링 -->
        </div>
        <button class="btn-create-room" onclick="openCreateRoomModal()">+ 새 캔버스 방 열기</button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="font-size: 18px; color: #fff;">🖼️ 개설된 캔버스 벽 목록</h2>
      <button class="btn-hud" onclick="loadRoomsList()">🔄 목록 새로고침</button>
    </div>

    <!-- 룸 카드 목록 -->
    <div class="rooms-grid" id="rooms-container">
      <!-- 룸 카드들 동적 주입 -->
    </div>
  </div>

  <!-- ====================================================
       화면 2: 인게임 대형 캔버스 화면
       ==================================================== -->
  <div id="game-screen">
    <div class="game-hud-top">
      <button class="btn-hud" onclick="leaveToLobby()">⬅ 로비로 나가기</button>
      <div style="font-size: 14px; font-weight: 800; color: #00f5d4; display: flex; align-items: center; gap: 6px;">
        <span id="ingame-room-badge" style="background:#9333ea; color:#fff; padding:2px 8px; border-radius:6px; font-size:11px;">LOBBY</span>
        <span id="ingame-room-title">열린 광장 캔버스</span>
      </div>
      <button class="btn-hud" onclick="openQrModal()">📷 방 QR 코드</button>
      <button class="btn-hud" style="color: #00f5d4; border-color: #00f5d4;" onclick="toggleVirtualController()">📱 가상 컨트롤러 (웹 테스트)</button>
      <button id="btn-camera-recenter" class="btn-hud" onclick="recenterCamera()" style="display:none; color: #ffe600; border-color: #ffe600;">🎯 내 캐릭터 추적</button>
    </div>

    <!-- 캔버스 본체 -->
    <canvas id="world-canvas"></canvas>
    <div id="spectator-controls" style="position: absolute; bottom: 20px; right: 20px; background: rgba(15, 12, 32, 0.75); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 6px 12px; font-size: 11px; color: #aaa; pointer-events: auto; display: flex; align-items: center; gap: 8px; z-index: 20;">
      <span>🔍 휠: 줌 (<span id="zoom-level-text" style="color:#00f5d4; font-weight:bold;">0.9x</span>)</span>
      <span>🖐️ 드래그: 자유 이동</span>
      <button id="btn-recenter-float" onclick="recenterCamera()" style="background:#7928ca; border:none; color:#fff; border-radius:6px; padding:3px 8px; cursor:pointer; font-size:11px;">🎯 캐릭터 추적</button>
    </div>

    <!-- 우측 상단 미니맵 -->
    <div class="minimap-card">
      <canvas id="minimap-canvas"></canvas>
    </div>

    <!-- 상단 AI 아트 도슨트 비평 배너 -->
    <div id="ai-docent-banner">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span style="font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px; background: #9333ea; color: #fff;">
          ✨ AI ART CURATOR
        </span>
        <span id="ai-meta-tag" style="font-size: 11px; color: #d8b4fe;">Gemini 실시간 분석</span>
      </div>
      <div id="ai-comment-text" style="font-size: 16px; font-weight: 800; color: #faf5ff; text-shadow: 0 0 10px #c084fc; line-height: 1.4;">
        도슨트 비평 로딩 중...
      </div>
    </div>

    <!-- 🤖 AI 아티스트 실시간 드로잉 PIP (Picture-in-Picture) 보조 윈도우 -->
    <div id="ai-pip-card" style="display: none; position: fixed; right: 20px; bottom: 24px; width: 320px; height: 230px; background: rgba(18, 12, 34, 0.95); border: 2px solid #a855f7; border-radius: 16px; box-shadow: 0 12px 35px rgba(168, 85, 247, 0.45); z-index: 100; overflow: hidden; backdrop-filter: blur(10px); transition: opacity 0.3s ease;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:rgba(168,85,247,0.25); border-bottom:1px solid rgba(168,85,247,0.3);">
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#ff0055; box-shadow:0 0 8px #ff0055;"></span>
          <span style="font-size:12px; font-weight:800; color:#faf5ff;" id="ai-pip-title">🤖 AI 드로잉 LIVE 중계</span>
        </div>
        <span id="ai-pip-prompt" style="font-size:10px; background:rgba(0,245,212,0.2); color:#00f5d4; padding:2px 6px; border-radius:6px; font-weight:700; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">그리는 중</span>
      </div>
      <canvas id="ai-pip-canvas" width="320" height="190" style="display:block; width:100%; height:190px;"></canvas>
    </div>
  </div>

  <!-- 방 전용 QR 팝업 모달 -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal-box" style="text-align: center;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color:#00f5d4; font-size:16px;">📱 스마트폰 연동 QR</h3>
        <button onclick="closeQrModal()" style="background:none; border:none; color:#888; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <p style="font-size:12px; opacity:0.75; margin-top:4px;">
        스마트폰으로 스캔하면 <strong id="modal-room-code-label" style="color:#00f5d4;">LOBBY</strong> 방에 즉시 연동됩니다!
      </p>
      <div id="modal-qr-container" style="display:flex; justify-content:center; margin:16px 0;"></div>
      <div style="font-size:11px; color:#aaa; word-break:break-all;" id="modal-qr-url"></div>
      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button onclick="openControllerNewTab()" style="flex:1; padding:10px; border-radius:10px; border:1px solid #00f5d4; background:transparent; color:#00f5d4; font-weight:800; cursor:pointer;">
          새 탭으로 열기 ↗
        </button>
        <button onclick="closeQrModal()" style="flex:1; padding:10px; border-radius:10px; border:none; background:#00f5d4; color:#000; font-weight:800; cursor:pointer;">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- PC 웹 테스트용 가상 스마트폰 컨트롤러 창 -->
  <div id="virtual-phone-container" style="display: none; position: fixed; right: 24px; bottom: 24px; width: 380px; height: 680px; background: #000; border: 3px solid #00f5d4; border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); z-index: 1500; overflow: hidden; flex-direction: column;">
    <div style="background: #121420; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <span style="font-size: 12px; font-weight: 800; color: #fff;">📱 웹 가상 컨트롤러</span>
      <div style="display: flex; gap: 6px;">
        <button onclick="openControllerNewTab()" style="background: none; border: none; color: #00f5d4; font-size: 13px; cursor: pointer;">↗ 새탭</button>
        <button onclick="toggleVirtualController()" style="background: none; border: none; color: #888; font-size: 16px; cursor: pointer;">✕</button>
      </div>
    </div>
    <iframe id="virtual-phone-frame" src="" style="width: 100%; height: 100%; border: none;"></iframe>
  </div>

  <!-- 새 방 만들기 모달 -->
  <div class="modal-overlay" id="create-room-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="color:#00f5d4; font-size:16px;">🎨 새 캔버스 방 만들기</h3>
        <button onclick="closeCreateRoomModal()" style="background:none; border:none; color:#888; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <div class="form-group">
        <label>방 코드 (영문/숫자, 고유 ID)</label>
        <input type="text" id="new-room-code" placeholder="예: NEON-777, MY-STUDIO">
      </div>
      <div class="form-group">
        <label>방 제목 (화면에 표시될 이름)</label>
        <input type="text" id="new-room-title" placeholder="예: 밤하늘 네온 아트 갤러리">
      </div>
      <div class="form-group" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="new-room-is-secret" style="width:auto;" onchange="toggleSecretInput(this.checked)">
        <label for="new-room-is-secret" style="margin:0; color:#c084fc; cursor:pointer;">🔒 비밀방으로 설정 (코드로만 입장)</label>
      </div>
      <div class="form-group" id="secret-code-group" style="display:none;">
        <label>비밀 입장 코드 (숫자/비밀번호)</label>
        <input type="password" id="new-room-secret-code" placeholder="비밀 코드를 입력하세요">
      </div>
      <button class="btn-create-room" style="width:100%; margin-top:8px;" onclick="submitCreateRoom()">캔버스 생성 및 입장</button>
    </div>
  </div>

  <!-- 비밀방 입장 코드 확인 모달 -->
  <div class="modal-overlay" id="secret-entry-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="color:#c084fc; font-size:16px;">🔒 비밀방 입장</h3>
        <button onclick="closeSecretEntryModal()" style="background:none; border:none; color:#888; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <p style="font-size:12px; opacity:0.8; margin-bottom:12px;">
        <strong id="secret-target-room-name" style="color:#00f5d4;"></strong> 방은 비밀 코드가 필요합니다.
      </p>
      <div class="form-group">
        <label>비밀 입장 코드</label>
        <input type="password" id="entry-secret-code" placeholder="비밀 코드를 입력하세요">
      </div>
      <button class="btn-create-room" style="width:100%;" onclick="submitSecretEntry()">입장하기</button>
    </div>
  </div>

  <!-- 로비 전용 로그인 & 회원가입 탭 모달 -->
  <div class="modal-overlay" id="lobby-login-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="color:#00f5d4; font-size:16px; margin:0;">🎨 아티스트 로그인 / 회원가입</h3>
      </div>

      <!-- 탭 바 -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:14px; background:rgba(0,0,0,0.4); padding:4px; border-radius:10px;">
        <button id="lobby-tab-btn-login" onclick="switchLobbyAuthTab('login')" style="padding:8px; border:none; border-radius:8px; background:#00f5d4; color:#000; font-size:12px; font-weight:800; cursor:pointer;">
          🔑 로그인
        </button>
        <button id="lobby-tab-btn-reg" onclick="switchLobbyAuthTab('register')" style="padding:8px; border:none; border-radius:8px; background:transparent; color:#888; font-size:12px; font-weight:800; cursor:pointer;">
          ✨ 회원가입
        </button>
      </div>

      <!-- 1. 로그인 폼 -->
      <form id="lobby-form-login" onsubmit="handleLobbyLogin(event)" style="display:block;">
        <div class="form-group">
          <label>아티스트 아이디</label>
          <input type="text" id="lobby-login-id" placeholder="아이디 (예: user_a)" required />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="lobby-login-pw" placeholder="비밀번호" required />
        </div>
        <button type="submit" class="btn-create-room" style="width:100%; margin-top:6px;">로그인하기</button>

        <div style="margin-top:14px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08);">
          <div style="font-size:11px; opacity:0.6; margin-bottom:6px; text-align:center;">빠른 테스트 계정:</div>
          <div style="display:flex; gap:6px;">
            <button type="button" onclick="quickLobbyAuth('user_a')" style="flex:1; padding:7px; border-radius:8px; border:1px solid #00f5d4; background:rgba(0,245,212,0.12); color:#00f5d4; font-size:11px; font-weight:700; cursor:pointer;">
              👑 user_a (VIP)
            </button>
            <button type="button" onclick="quickLobbyAuth('user_b')" style="flex:1; padding:7px; border-radius:8px; border:1px solid #f15bb5; background:rgba(241,91,181,0.12); color:#f15bb5; font-size:11px; font-weight:700; cursor:pointer;">
              🎨 user_b (일반)
            </button>
          </div>
        </div>
      </form>

      <!-- 2. 회원가입 폼 -->
      <form id="lobby-form-reg" onsubmit="handleLobbyRegister(event)" style="display:none;">
        <div class="form-group">
          <label>새 아티스트 아이디</label>
          <input type="text" id="lobby-reg-id" placeholder="영문/숫자 아이디" required />
        </div>
        <div class="form-group">
          <label>닉네임 / 활동명</label>
          <input type="text" id="lobby-reg-alias" placeholder="화면에 표시될 이름" required />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="lobby-reg-pw" placeholder="비밀번호" required />
        </div>
        <div class="form-group">
          <label>아티스트 등급 선택</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px;">
            <label style="display:flex; align-items:center; gap:6px; padding:6px; border-radius:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); font-size:11px; cursor:pointer;">
              <input type="radio" name="lobby-reg-role" value="vip" checked />
              <span style="color:#00f5d4; font-weight:bold;">💎 VIP</span>
            </label>
            <label style="display:flex; align-items:center; gap:6px; padding:6px; border-radius:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); font-size:11px; cursor:pointer;">
              <input type="radio" name="lobby-reg-role" value="standard" />
              <span style="color:#aaa;">🎨 일반</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn-create-room" style="width:100%; background:#c084fc; border-color:#c084fc;">회원가입 완료 및 입장</button>
      </form>

      <div id="lobby-auth-err" style="color:#ff595e; font-size:11px; text-align:center; margin-top:8px; min-height:14px;"></div>
    </div>
  </div>

  <script src="/js/screen.js"></script>
</body>
</html>
